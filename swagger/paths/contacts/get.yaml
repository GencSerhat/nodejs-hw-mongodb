tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve a list of all contacts, with optional pagination and filtering.
security:
  - bearerAuth: []

parameters:
  - name: page
    in: query
    description: Page number for pagination
    required: false
    schema:
      type: integer
      default: 1

  - name: limit
    in: query
    description: Number of contacts per page
    required: false
    schema:
      type: integer
      default: 20

  - name: favorite
    in: query
    description: Filter contacts by favorite status
    required: false
    schema:
      type: boolean

responses:
  '200':
    description: Successfully retrieved list of contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
            message:
              type: string
            data:
              type: array
              items:
                $ref: ../../components/schemas/Contact.yaml

  '401':
    description: Unauthorized access
    content:
      application/json:
        schema:
          $ref: ../../components/responses/Unauthorized.yaml

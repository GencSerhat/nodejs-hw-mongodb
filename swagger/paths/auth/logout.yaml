tags:
  - Auth
summary: User logout
operationId: logoutUser
description: Logs out the currently authenticated user by invalidating their token.
security:
  - bearerAuth: []

responses:
  '204':
    description: Logout successful. No content returned.

  '401':
    description: Unauthorized access
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Unauthorized
